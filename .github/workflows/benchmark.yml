name: Benchmark browser kernels

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repetitions per variant (fresh browser contexts)
        default: '3'
        required: true
        type: choice
        options: ['1', '3', '5']
      cache:
        description: Browser-cache scenarios
        default: both
        type: choice
        options: [cold, both]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
          locked: true
      - uses: actions/cache@v4
        with:
          path: .cache/xeus
          key: wasm-${{ runner.os }}-${{ hashFiles('environment*.yml', 'pixi.lock') }}
      - name: Install Chromium for the measurements
        run: pixi run python -m playwright install --with-deps chromium
      - name: Build the three notebook variants
        run: pixi run build
      - name: Measure kernel setup, installation, and cell execution
        run: pixi run python scripts/benchmark.py --repeats '${{ inputs.repeats }}' --cache '${{ inputs.cache }}'
      - name: Add results to the workflow summary
        if: always()
        run: |
          if [ -f artifacts/benchmark.md ]; then
            cat artifacts/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-kernel-benchmarks
          path: artifacts/
