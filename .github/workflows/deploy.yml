name: Test and deploy JupyterLite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
          locked: true
      - name: Cache WebAssembly environments and packages
        uses: actions/cache@v4
        with:
          path: .cache/xeus
          key: wasm-${{ runner.os }}-${{ hashFiles('environment*.yml', 'pixi.lock') }}
      - name: Execute the notebook on CPython
        run: pixi run validate
      - name: Build the static JupyterLite site
        run: pixi run build
      - name: Install the browser
        run: pixi run python -m playwright install --with-deps chromium
      - name: Execute the notebook in JupyterLite / Xeus-Python
        run: pixi run python scripts/test_browser.py
      - name: Check both runtime-install variants
        run: pixi run python scripts/benchmark.py --repeats 1 --skip-rerun --variants pyodide xeus-runtime --output artifacts/runtime-smoke.json
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
